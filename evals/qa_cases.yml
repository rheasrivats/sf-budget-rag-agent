  - id: budget_process_timeline
    query: "What is the high-level timeline for San Francisco's budget process?"
    reference_answer: "The process starts in the fall for the fiscal year beginning July 1. Departments get instructions and propose budgets in December, departments send proposals to the Mayor and Board in March, the Mayor proposes a City budget in June, the Board amends and approves it in July, and the Mayor signs it in August."
    expected_source_kinds: ["official"]
    expected_citation_urls:
      - "https://sf.gov/documents/41166/70_CSF_Proposed_Budget_Book_June_2024_Final_REV1_0525v2_UMl4gFg.pdf"
    relevant_doc_ids: [11]
    must_not_include: ["generated plan", "our plan", "plan://", "https://sf.gov/topics/budget"]
    rubric_notes: "Answer should summarize the official budget process timeline chronologically, using the non-HTML official budget book as the expected source."

  - id: march_shortfall_update
    query: "What two-year shortfall did the March 2025 update project for FY 2025-26 and FY 2026-27, and how did that compare with the December 2024 projection?"
    reference_answer: "The March 2025 update projected an $817.5 million two-year shortfall, which was $58.5 million less than the $875.9 million shortfall projected in December 2024."
    expected_source_kinds: ["official"]
    expected_citation_urls:
